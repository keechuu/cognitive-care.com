<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Care - Login Portal</title>
  <!-- Google Fonts: Merriweather for serif headings, Plus Jakarta Sans for clean UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Merriweather', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#062146',
              navyHover: '#0A2D5C',
              mint: '#80EEDF',
              mintHover: '#6DE2D2',
              mintDark: '#094F48',
              canvas: '#FBFBFA',
              sidebar: '#F8F9FA',
              inputBg: '#F1F3F5',
              borderLight: '#E8EAED',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans bg-brand-canvas text-slate-800 antialiased h-screen overflow-hidden flex">

  <!-- Mobile Sidebar Overlay Backdrop -->
  <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-30 hidden lg:hidden"></div>

  <!-- Left Navigation Sidebar -->
  <aside id="sidebar" class="w-64 bg-brand-sidebar border-r border-brand-borderLight flex flex-col justify-between p-6 z-40 fixed lg:static inset-y-0 -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
    <div>
      <!-- Brand Logo / Title -->
      <div class="flex items-center justify-between pb-8">
        <h1 class="font-serif text-2xl font-bold text-slate-900 tracking-tight cursor-pointer" onclick="speak('Cognitive Care Navigation')">
          Cognitive Care
        </h1>
        <!-- Mobile close button -->
        <button id="close-sidebar-btn" class="lg:hidden text-slate-400 hover:text-slate-600 p-1" aria-label="Close sidebar">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Navigation Menu Items -->
      <nav class="space-y-1.5" aria-label="Main Navigation">
        <a href="home.html" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Home">
          <i data-lucide="layout-grid" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Home</span>
        </a>

        <a href="games.html" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Games">
          <i data-lucide="gamepad-2" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Games</span>
        </a>

        <a href="progress.html" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Progress">
          <i data-lucide="trending-up" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Progress</span>
        </a>

        <a href="#" onclick="alert('Reports section coming soon!')" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Reports">
          <i data-lucide="file-text" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Reports</span>
        </a>

        <a href="#" onclick="alert('Alerts panel: No new urgent alerts.')" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Alerts">
          <i data-lucide="bell" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Alerts</span>
        </a>

        <a href="#" onclick="alert('Reminders active for today.')" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Reminders">
          <i data-lucide="timer" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Reminders</span>
        </a>

        <a href="#" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Profile">
          <i data-lucide="circle-user-round" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Profile</span>
        </a>

        <a href="#" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Settings">
          <i data-lucide="settings" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Settings</span>
        </a>
      </nav>
    </div>

    <!-- Sidebar footer note -->
    <div class="text-xs text-slate-400 text-center pt-4 border-t border-slate-200/60">
      v1.0 • Care Platform
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-brand-canvas">
    
    <!-- Top Bar -->
    <header class="w-full flex items-center justify-between px-6 sm:px-10 py-5">
      <div class="flex items-center gap-3">
        <!-- Mobile Sidebar Toggle -->
        <button id="open-sidebar-btn" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100" aria-label="Open navigation menu">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>

        <!-- Mode Badge Switcher -->
        <button id="mode-switcher-btn" class="flex items-center gap-2 bg-brand-mint/90 hover:bg-brand-mint text-brand-mintDark px-4 py-2 rounded-full font-medium text-sm transition-all shadow-sm active:scale-95 cursor-pointer" title="Click to switch between Caregiver and Patient mode">
          <i data-lucide="arrow-left-right" class="w-4 h-4 stroke-[2.2]"></i>
          <span id="mode-label">Mode: Caregiver</span>
        </button>
      </div>

      <!-- Top Right Action Icons -->
      <div class="flex items-center gap-3">
        <!-- Notifications Bell -->
        <button class="w-10 h-10 rounded-full bg-slate-200/70 hover:bg-slate-200 flex items-center justify-center text-slate-700 transition-colors" aria-label="Notifications" title="Notifications">
          <i data-lucide="bell" class="w-5 h-5 stroke-[1.75]"></i>
        </button>

        <!-- Profile Avatar Button -->
        <button class="w-10 h-10 rounded-full bg-brand-navy hover:bg-brand-navyHover flex items-center justify-center text-white transition-colors shadow-sm" aria-label="Account Profile" title="User Profile">
          <i data-lucide="user" class="w-5 h-5 stroke-[1.75]"></i>
        </button>
      </div>
    </header>

    <!-- Center Stage Login Card Area -->
    <div class="flex-1 flex items-center justify-center p-4 sm:p-8">
      <div class="login-card w-full max-w-[460px] bg-white rounded-[28px] p-8 sm:p-10 shadow-2xl relative">

        <!-- Top Badge: Secure Portal -->
        <div class="flex justify-center mb-5">
          <div class="inline-flex items-center gap-1.5 bg-brand-mint/60 text-brand-mintDark px-3.5 py-1.5 rounded-full text-xs font-semibold tracking-wide">
            <i data-lucide="shield-check" class="w-4 h-4 stroke-[2.2]"></i>
            <span>Secure Portal</span>
          </div>
        </div>

        <!-- Heading & Subtitle -->
        <div class="text-center mb-8">
          <h2 class="font-serif text-3xl sm:text-[32px] font-bold text-slate-900 tracking-tight leading-tight">
            Welcome Back
          </h2>
          <p class="text-slate-500 text-sm mt-2">
            Continue your cognitive care journey.
          </p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5" onsubmit="return false;">
          
          <!-- Email or Phone Number Input -->
          <div>
            <label id="label-email" for="email-input" class="audio-speakable block text-sm font-semibold text-slate-800 mb-2 cursor-pointer flex items-center justify-between" title="Click to hear guidance">
              <span>Email or Phone Number</span>
              <span class="text-[11px] text-teal-700 opacity-0 group-hover:opacity-100 font-normal">🔊</span>
            </label>
            <div class="input-box flex items-center gap-3 px-4 py-3.5 rounded-xl border border-transparent focus-within:border-brand-mint">
              <i data-lucide="user" class="w-5 h-5 text-slate-400 stroke-[1.75]"></i>
              <input 
                id="email-input" 
                type="text" 
                placeholder="name@example.com or phone" 
                class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <label id="label-password" for="password-input" class="audio-speakable block text-sm font-semibold text-slate-800 mb-2 cursor-pointer flex items-center justify-between" title="Click to hear guidance">
              <span>Password</span>
              <span class="text-[11px] text-teal-700 opacity-0 group-hover:opacity-100 font-normal">🔊</span>
            </label>
            <div class="input-box flex items-center gap-3 px-4 py-3.5 rounded-xl border border-transparent focus-within:border-brand-mint">
              <i data-lucide="lock" class="w-5 h-5 text-slate-400 stroke-[1.75]"></i>
              <input 
                id="password-input" 
                type="password" 
                placeholder="Enter your password" 
                class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
                autocomplete="current-password"
                required
              >
              <button 
                type="button" 
                id="toggle-password-btn" 
                class="text-slate-400 hover:text-slate-600 transition-colors p-1" 
                aria-label="Toggle password visibility"
                title="Show/Hide password"
              >
                <i id="eye-icon" data-lucide="eye" class="w-5 h-5 stroke-[1.75]"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password Row -->
          <div class="flex items-center justify-between pt-1">
            <label id="label-remember" class="audio-speakable flex items-center gap-2 cursor-pointer select-none text-sm text-slate-700">
              <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-slate-300 text-brand-navy focus:ring-brand-mint cursor-pointer accent-brand-navy">
              <span>Remember me</span>
            </label>
            <a href="#" id="forgot-password-link" class="audio-speakable text-sm font-semibold text-teal-700 hover:text-teal-800 transition-colors">
              Forgot password?
            </a>
          </div>

          <!-- Action Buttons -->
          <div class="space-y-3 pt-2">
            <!-- Primary Login Button -->
            <button 
              type="submit" 
              id="login-btn"
              class="w-full bg-brand-navy hover:bg-brand-navyHover text-white py-3.5 px-4 rounded-xl font-medium text-sm flex items-center justify-center gap-2 transition-all shadow-md active:scale-[0.99] cursor-pointer"
            >
              <span>Login</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>

            <!-- Secondary Create Account Button -->
            <button 
              type="button" 
              id="create-account-btn"
              class="w-full bg-brand-mint hover:bg-brand-mintHover text-brand-mintDark py-3.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition-all shadow-sm active:scale-[0.99] cursor-pointer"
            >
              <span>Create an Account</span>
              <i data-lucide="user-plus" class="w-4 h-4 stroke-[2.2]"></i>
            </button>
          </div>

        </form>

        <!-- Accessibility Guidance Footer -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
          <button 
            type="button" 
            id="audio-help-btn"
            class="inline-flex items-center gap-2 text-xs text-slate-500 hover:text-teal-800 transition-colors p-1 rounded-lg group"
            title="Click to hear assistance"
          >
            <i data-lucide="volume-2" class="w-4 h-4 text-teal-700 group-hover:scale-110 transition-transform"></i>
            <span>Need help logging in? Click anywhere on the labels to hear guidance.</span>
          </button>
        </div>

      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
