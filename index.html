<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Care - Login Portal</title>
  <!-- Google Fonts: Merriweather for serif headings, Plus Jakarta Sans for clean UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Merriweather', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#062146',
              navyHover: '#0A2D5C',
              mint: '#80EEDF',
              mintHover: '#6DE2D2',
              mintDark: '#094F48',
              canvas: '#FBFBFA',
              sidebar: '#F8F9FA',
              inputBg: '#F1F3F5',
              borderLight: '#E8EAED',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
/* Custom Styling for Cognitive Care Portal */

/* Active Sidebar Navigation Item */
.nav-item.active {
  background-color: #062146 !important;
  color: #ffffff !important;
}

.nav-item.active i {
  stroke: #ffffff !important;
}

/* Input Box Focus and Styling */
.input-box {
  background-color: #F1F3F5;
  border: 1.5px solid transparent;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.input-box:focus-within {
  background-color: #ffffff;
  border-color: #80EEDF;
  box-shadow: 0 0 0 4px rgba(128, 238, 223, 0.25);
}

/* Card Elevation Shadow */
.login-card {
  box-shadow: 0 25px 50px -12px rgba(6, 33, 70, 0.09), 0 4px 20px -2px rgba(0, 0, 0, 0.04);
}

/* Audio guidance speakable hover indicators */
.audio-speakable {
  transition: color 0.15s ease;
  user-select: none;
}

.audio-speakable:hover {
  color: #094F48;
}

.audio-speaking {
  animation: speak-pulse 1.2s infinite ease-in-out;
  color: #094F48 !important;
}

@keyframes speak-pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.02);
    opacity: 0.8;
  }
}

/* Custom Scrollbar for responsiveness */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #E2E8F0;
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: #CBD5E1;
}
</style>
</head>
<body class="font-sans bg-brand-canvas text-slate-800 antialiased h-screen overflow-hidden flex">

  <!-- Mobile Sidebar Overlay Backdrop -->
  <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-30 hidden lg:hidden"></div>

  <!-- Left Navigation Sidebar -->
  <aside id="sidebar" class="w-64 bg-brand-sidebar border-r border-brand-borderLight flex flex-col justify-between p-6 z-40 fixed lg:static inset-y-0 -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
    <div>
      <!-- Brand Logo / Title -->
      <div class="flex items-center justify-between pb-8">
        <div class="flex items-center gap-3 cursor-pointer" onclick="speak('Cognitive Care Navigation')">
          <img src="assets/cognitive-care-logo.png" alt="Cognitive Care" class="w-11 h-11 rounded-xl object-cover bg-black shadow-sm">
          <div class="font-serif text-xl font-bold text-slate-900 leading-tight">Cognitive Care</div>
        </div>
        <!-- Mobile close button -->
        <button id="close-sidebar-btn" class="lg:hidden text-slate-400 hover:text-slate-600 p-1" aria-label="Close sidebar">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Navigation Menu Items -->
      <nav class="space-y-1.5" aria-label="Main Navigation">
        <a href="home.html" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Home">
          <i data-lucide="layout-grid" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Home</span>
        </a>

        <a href="games.html" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Games">
          <i data-lucide="gamepad-2" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Games</span>
        </a>

        <a href="album.html" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Memory Album">
          <i data-lucide="images" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Memory Album</span>
        </a>

        <a href="reminders.html" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Reminders">
          <i data-lucide="bell-ring" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Reminders</span>
        </a>

        <a href="progress.html" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Progress">
          <i data-lucide="trending-up" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Progress</span>
        </a>

        <a href="profile.html" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Profile">
          <i data-lucide="circle-user-round" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Profile</span>
        </a>

        <a href="settings.html" class="nav-item flex items-center gap-3.5 px-4 py-3 rounded-xl font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-200/50 transition-all" data-nav="Settings">
          <i data-lucide="settings" class="w-5 h-5 stroke-[1.75]"></i>
          <span>Settings</span>
        </a>
      </nav>
    </div>

    <!-- Sidebar footer note -->
    <div class="text-xs text-slate-400 text-center pt-4 border-t border-slate-200/60">
      v1.0 • Care Platform
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-brand-canvas">
    
    <!-- Top Bar -->
    <header class="w-full flex items-center justify-between gap-4 px-6 sm:px-10 py-5 bg-brand-canvas sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <button id="open-sidebar-btn" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100" aria-label="Open menu">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
      </div>
      <div class="flex items-center gap-3 sm:gap-4">
      <div class="flex items-center gap-2 sm:gap-3 bg-white border border-slate-200/80 px-3 sm:px-4 py-2 rounded-2xl shadow-xs text-slate-700 shrink-0" aria-label="Current date and time">
        <div class="flex items-center gap-2 text-xs font-semibold text-slate-500">
          <i data-lucide="calendar-days" class="w-4 h-4"></i>
          <span id="current-day">Tuesday</span>
        </div>
        <span class="text-slate-300">•</span>
        <div class="flex items-center gap-2 text-sm font-bold">
          <span id="current-date">September 8, 2026</span>
        </div>
        <span class="text-slate-300">•</span>
        <div class="flex items-center gap-2 text-sm font-black text-brand-navy">
          <i data-lucide="clock-3" class="w-4 h-4"></i>
          <span id="current-time">3:15 PM</span>
        </div>
      </div>
      </div>
    </header>

    <!-- Center Stage Login Card Area -->
    <div class="flex-1 flex items-center justify-center p-4 sm:p-8">
      <div class="login-card w-full max-w-[460px] bg-white rounded-[28px] p-8 sm:p-10 shadow-2xl relative">

        <!-- Top Badge: Secure Portal -->
        <div class="flex justify-center mb-5">
          <div class="inline-flex items-center gap-1.5 bg-brand-mint/60 text-brand-mintDark px-3.5 py-1.5 rounded-full text-xs font-semibold tracking-wide">
            <i data-lucide="shield-check" class="w-4 h-4 stroke-[2.2]"></i>
            <span>Secure Portal</span>
          </div>
        </div>

        <!-- Heading & Subtitle -->
        <div class="text-center mb-8">
          <h2 class="font-serif text-3xl sm:text-[32px] font-bold text-slate-900 tracking-tight leading-tight">
            Welcome Back
          </h2>
          <p class="text-slate-500 text-sm mt-2">
            Continue your cognitive care journey.
          </p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5" onsubmit="return false;">
          
          <!-- Email or Phone Number Input -->
          <div>
            <label id="label-email" for="email-input" class="audio-speakable block text-sm font-semibold text-slate-800 mb-2 cursor-pointer flex items-center justify-between" title="Click to hear guidance">
              <span>Email or Phone Number</span>
              <span class="text-[11px] text-teal-700 opacity-0 group-hover:opacity-100 font-normal">🔊</span>
            </label>
            <div class="input-box flex items-center gap-3 px-4 py-3.5 rounded-xl border border-transparent focus-within:border-brand-mint">
              <i data-lucide="user" class="w-5 h-5 text-slate-400 stroke-[1.75]"></i>
              <input 
                id="email-input" 
                type="text" 
                placeholder="name@example.com or phone" 
                class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <label id="label-password" for="password-input" class="audio-speakable block text-sm font-semibold text-slate-800 mb-2 cursor-pointer flex items-center justify-between" title="Click to hear guidance">
              <span>Password</span>
              <span class="text-[11px] text-teal-700 opacity-0 group-hover:opacity-100 font-normal">🔊</span>
            </label>
            <div class="input-box flex items-center gap-3 px-4 py-3.5 rounded-xl border border-transparent focus-within:border-brand-mint">
              <i data-lucide="lock" class="w-5 h-5 text-slate-400 stroke-[1.75]"></i>
              <input 
                id="password-input" 
                type="password" 
                placeholder="Enter your password" 
                class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
                autocomplete="current-password"
                required
              >
              <button 
                type="button" 
                id="toggle-password-btn" 
                class="text-slate-400 hover:text-slate-600 transition-colors p-1" 
                aria-label="Toggle password visibility"
                title="Show/Hide password"
              >
                <i id="eye-icon" data-lucide="eye" class="w-5 h-5 stroke-[1.75]"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password Row -->
          <div class="flex items-center justify-between pt-1">
            <label id="label-remember" class="audio-speakable flex items-center gap-2 cursor-pointer select-none text-sm text-slate-700">
              <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-slate-300 text-brand-navy focus:ring-brand-mint cursor-pointer accent-brand-navy">
              <span>Remember me</span>
            </label>
            <a href="#" id="forgot-password-link" class="audio-speakable text-sm font-semibold text-teal-700 hover:text-teal-800 transition-colors">
              Forgot password?
            </a>
          </div>

          <p id="login-error" class="hidden text-sm text-rose-600 font-medium bg-rose-50 border border-rose-200 rounded-xl px-4 py-2.5"></p>

          <!-- Action Buttons -->
          <div class="space-y-3 pt-2">
            <!-- Primary Login Button -->
            <button 
              type="submit" 
              id="login-btn"
              class="w-full bg-brand-navy hover:bg-brand-navyHover text-white py-3.5 px-4 rounded-xl font-medium text-sm flex items-center justify-center gap-2 transition-all shadow-md active:scale-[0.99] cursor-pointer"
            >
              <span>Login</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>

            <!-- Secondary Create Account Button -->
            <button 
              type="button" 
              id="create-account-btn"
              class="w-full bg-brand-mint hover:bg-brand-mintHover text-brand-mintDark py-3.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition-all shadow-sm active:scale-[0.99] cursor-pointer"
            >
              <span>Create an Account</span>
              <i data-lucide="user-plus" class="w-4 h-4 stroke-[2.2]"></i>
            </button>
            <p class="text-[11px] text-slate-400 text-center px-2">
              This password will also be used to edit the caregiver's phone number later.
            </p>
          </div>

        </form>

        <!-- Accessibility Guidance Footer -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
          <button 
            type="button" 
            id="audio-help-btn"
            class="inline-flex items-center gap-2 text-xs text-slate-500 hover:text-teal-800 transition-colors p-1 rounded-lg group"
            title="Click to hear assistance"
          >
            <i data-lucide="volume-2" class="w-4 h-4 text-teal-700 group-hover:scale-110 transition-transform"></i>
            <span>Need help logging in? Click anywhere on the labels to hear guidance.</span>
          </button>
        </div>

      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    function updateHeaderDateTime(){
      const now=new Date();
      const day=now.toLocaleDateString(undefined,{weekday:'long'});
      const date=now.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
      const time=now.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit',hour12:true});
      const d=document.getElementById('current-day'), dt=document.getElementById('current-date'), t=document.getElementById('current-time');
      if(d)d.textContent=day; if(dt)dt.textContent=date; if(t)t.textContent=time;
    }
    updateHeaderDateTime(); setInterval(updateHeaderDateTime,1000);
  </script>
</body>
</html>
