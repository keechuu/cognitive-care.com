<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive Care - Login Portal</title>
  <!-- Google Fonts: Merriweather for serif headings, Plus Jakarta Sans for clean UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Merriweather', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              navy: '#062146',
              navyHover: '#0A2D5C',
              mint: '#80EEDF',
              mintHover: '#6DE2D2',
              mintDark: '#094F48',
              canvas: '#FBFBFA',
              sidebar: '#F8F9FA',
              inputBg: '#F1F3F5',
              borderLight: '#E8EAED',
            }
          }
        }
      }
    }
  </script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
/* Custom Styling for Cognitive Care Portal */

/* Active Sidebar Navigation Item */
.nav-item.active {
  background-color: #062146 !important;
  color: #ffffff !important;
}

.nav-item.active i {
  stroke: #ffffff !important;
}

/* Input Box Focus and Styling */
.input-box {
  background-color: #F1F3F5;
  border: 1.5px solid transparent;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

.input-box:focus-within {
  background-color: #ffffff;
  border-color: #80EEDF;
  box-shadow: 0 0 0 4px rgba(128, 238, 223, 0.25);
}

/* Card Elevation Shadow */
.login-card {
  box-shadow: 0 25px 50px -12px rgba(6, 33, 70, 0.09), 0 4px 20px -2px rgba(0, 0, 0, 0.04);
}

/* Audio guidance speakable hover indicators */
.audio-speakable {
  transition: color 0.15s ease;
  user-select: none;
}

.audio-speakable:hover {
  color: #094F48;
}

.audio-speaking {
  animation: speak-pulse 1.2s infinite ease-in-out;
  color: #094F48 !important;
}

@keyframes speak-pulse {
  0%, 100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.02);
    opacity: 0.8;
  }
}

/* Custom Scrollbar for responsiveness */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #E2E8F0;
  border-radius: 9999px;
}
::-webkit-scrollbar-thumb:hover {
  background: #CBD5E1;
}
</style>
</head>
<body class="font-sans bg-brand-canvas text-slate-800 antialiased min-h-screen">
  <header class="w-full px-5 sm:px-8 py-5 bg-white/80 backdrop-blur border-b border-slate-200/70">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <img src="assets/cognitive-care-logo.png" alt="Cognitive Care" class="w-11 h-11 rounded-xl object-cover bg-black shadow-sm">
        <div class="font-serif text-xl font-bold text-slate-900">Cognitive Care</div>
      </a>
      <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-slate-900">Back</a>
    </div>
  </header>
  <main class="min-h-[calc(100vh-82px)] flex items-center justify-center p-4 sm:p-8">
    <div class="w-full max-w-[460px]">
      
    <div class="flex-1 flex items-center justify-center p-4 sm:p-8">
      <div class="login-card w-full max-w-[460px] bg-white rounded-[28px] p-8 sm:p-10 shadow-2xl relative">

        <!-- Top Badge: Secure Portal -->
        <div class="flex justify-center mb-5">
          <div class="inline-flex items-center gap-1.5 bg-brand-mint/60 text-brand-mintDark px-3.5 py-1.5 rounded-full text-xs font-semibold tracking-wide">
            <i data-lucide="shield-check" class="w-4 h-4 stroke-[2.2]"></i>
            <span>Secure Portal</span>
          </div>
        </div>

        <!-- Heading & Subtitle -->
        <div class="text-center mb-8">
          <h2 class="font-serif text-3xl sm:text-[32px] font-bold text-slate-900 tracking-tight leading-tight">
            Welcome Back
          </h2>
          <p class="text-slate-500 text-sm mt-2">
            Continue your cognitive care journey.
          </p>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5">
          
          <!-- Email or Phone Number Input -->
          <div>
            <label id="label-email" for="email-input" class="audio-speakable block text-sm font-semibold text-slate-800 mb-2 cursor-pointer flex items-center justify-between" title="Click to hear guidance">
              <span>Email or Phone Number</span>
              <span class="text-[11px] text-teal-700 opacity-0 group-hover:opacity-100 font-normal">🔊</span>
            </label>
            <div class="input-box flex items-center gap-3 px-4 py-3.5 rounded-xl border border-transparent focus-within:border-brand-mint">
              <i data-lucide="user" class="w-5 h-5 text-slate-400 stroke-[1.75]"></i>
              <input 
                id="email-input" 
                type="text" 
                placeholder="name@example.com or phone" 
                class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <label id="label-password" for="password-input" class="audio-speakable block text-sm font-semibold text-slate-800 mb-2 cursor-pointer flex items-center justify-between" title="Click to hear guidance">
              <span>Password</span>
              <span class="text-[11px] text-teal-700 opacity-0 group-hover:opacity-100 font-normal">🔊</span>
            </label>
            <div class="input-box flex items-center gap-3 px-4 py-3.5 rounded-xl border border-transparent focus-within:border-brand-mint">
              <i data-lucide="lock" class="w-5 h-5 text-slate-400 stroke-[1.75]"></i>
              <input 
                id="password-input" 
                type="password" 
                placeholder="Enter your password" 
                class="w-full bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none"
                autocomplete="current-password"
                required
              >
              <button 
                type="button" 
                id="toggle-password-btn" 
                class="text-slate-400 hover:text-slate-600 transition-colors p-1" 
                aria-label="Toggle password visibility"
                title="Show/Hide password"
              >
                <i id="eye-icon" data-lucide="eye" class="w-5 h-5 stroke-[1.75]"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password Row -->
          <div class="flex items-center justify-between pt-1">
            <label id="label-remember" class="audio-speakable flex items-center gap-2 cursor-pointer select-none text-sm text-slate-700">
              <input type="checkbox" id="remember-me" class="w-4 h-4 rounded border-slate-300 text-brand-navy focus:ring-brand-mint cursor-pointer accent-brand-navy">
              <span>Remember me</span>
            </label>
            <a href="#" id="forgot-password-link" class="audio-speakable text-sm font-semibold text-teal-700 hover:text-teal-800 transition-colors">
              Forgot password?
            </a>
          </div>

          <p id="login-error" class="hidden text-sm text-rose-600 font-medium bg-rose-50 border border-rose-200 rounded-xl px-4 py-2.5"></p>

          <!-- Action Buttons -->
          <div class="space-y-3 pt-2">
            <!-- Primary Login Button -->
            <button 
              type="submit" 
              id="login-btn"
              class="w-full bg-brand-navy hover:bg-brand-navyHover text-white py-3.5 px-4 rounded-xl font-medium text-sm flex items-center justify-center gap-2 transition-all shadow-md active:scale-[0.99] cursor-pointer"
            >
              <span>Login</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>

            <!-- Secondary Create Account Button -->
            <button 
              type="button" 
              id="create-account-btn"
              class="w-full bg-brand-mint hover:bg-brand-mintHover text-brand-mintDark py-3.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition-all shadow-sm active:scale-[0.99] cursor-pointer"
            >
              <span>Create an Account</span>
              <i data-lucide="user-plus" class="w-4 h-4 stroke-[2.2]"></i>
            </button>
            <p class="text-[11px] text-slate-400 text-center px-2">
              This password will also be used to edit the caregiver's phone number later.
            </p>
          </div>

        </form>

        <!-- Accessibility Guidance Footer -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
          <button 
            type="button" 
            id="audio-help-btn"
            class="inline-flex items-center gap-2 text-xs text-slate-500 hover:text-teal-800 transition-colors p-1 rounded-lg group"
            title="Click to hear assistance"
          >
            <i data-lucide="volume-2" class="w-4 h-4 text-teal-700 group-hover:scale-110 transition-transform"></i>
            <span>Need help logging in? Click anywhere on the labels to hear guidance.</span>
          </button>
        </div>

      </div>
    </div>
  

  
    </div>
  </main>
  <!-- Create Account Modal -->
  <div id="create-account-modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-slate-950/55 p-4 backdrop-blur-sm">
    <div class="w-full max-w-lg rounded-3xl bg-white shadow-2xl border border-slate-200 p-6 sm:p-8">
      <div class="flex items-start justify-between gap-4 mb-6">
        <div>
          <p class="text-xs font-bold uppercase tracking-[0.18em] text-teal-700">Cognitive Care</p>
          <h3 class="font-serif text-2xl sm:text-3xl font-bold text-slate-900 mt-1">Create your account</h3>
          <p class="text-sm text-slate-500 mt-1">Set up your caregiver account in a few steps.</p>
        </div>
        <button type="button" id="create-account-close" class="p-2 rounded-xl text-slate-400 hover:bg-slate-100 hover:text-slate-700" aria-label="Close">✕</button>
      </div>
      <form id="create-account-form" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-800 mb-2" for="create-name">Caregiver name</label>
          <input id="create-name" type="text" required autocomplete="name" placeholder="Your name" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-200">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-800 mb-2" for="create-email">Email or phone</label>
          <input id="create-email" type="text" required autocomplete="username" placeholder="name@example.com or phone" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-200">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-800 mb-2" for="create-password">Password</label>
          <input id="create-password" type="password" required minlength="4" autocomplete="new-password" placeholder="At least 4 characters" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-200">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-800 mb-2" for="create-password-confirm">Confirm password</label>
          <input id="create-password-confirm" type="password" required minlength="4" autocomplete="new-password" placeholder="Re-enter password" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-teal-200">
        </div>
        <p id="create-account-error" class="hidden text-sm text-rose-600 bg-rose-50 border border-rose-200 rounded-xl px-4 py-3"></p>
        <div class="flex gap-3 pt-2">
          <button type="button" id="create-account-cancel" class="flex-1 py-3 rounded-xl border border-slate-200 text-slate-700 font-semibold hover:bg-slate-50">Cancel</button>
          <button type="submit" class="flex-1 py-3 rounded-xl bg-brand-navy text-white font-semibold hover:bg-brand-navyHover">Create account</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="app.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{if(window.lucide) lucide.createIcons();});</script>
</body>
</html>
